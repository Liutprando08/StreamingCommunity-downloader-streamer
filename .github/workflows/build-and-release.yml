name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Configura uv e abilita il caching automatico per velocizzare i build futuri
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # uv installa Python automaticamente basandosi sul pyproject.toml o sul flag specificato
      - name: Set up Python
        run: uv python install 3.12

      # Sincronizza le dipendenze dal file uv.lock, creando il virtualenv
      # (pyinstaller>=6.21: lo spec usa Analysis.exclude_system_libraries())
      - name: Install dependencies
        run: uv sync && uv pip install "pyinstaller>=6.21"

      # UPX comprime i binari nel bundle (upx=True nello spec). E' un no-op se
      # upx non e' sul PATH: senza questo step i release binary escono molto
      # piu' grandi di quelli buildati localmente.
      # NOTA: UPX non supporta Mach-O, quindi macOS resta senza compressione.
      # UPX completely disabled to avoid DLL corruption on Windows
      # - name: Install UPX (Linux)
      #   if: runner.os == 'Linux'
      #   run: |
      #     sudo apt-get update -qq
      #     sudo apt-get install -y -qq upx || sudo apt-get install -y -qq upx-ucl
      #     upx --version | head -1
      # - name: Install UPX (Windows)
      #   if: runner.os == 'Windows'
      #   shell: pwsh
      #   run: |
      #     $ver = '5.2.1'
      #     $url = "https://github.com/upx/upx/releases/download/v$ver/upx-$ver-win64.zip"
      #     Invoke-WebRequest -Uri $url -OutFile upx.zip
      #     Expand-Archive upx.zip -DestinationPath upx -Force
      #     Add-Content -Path $env:GITHUB_PATH -Value (Resolve-Path "upx/upx-$ver-win64")

      # Esegue pyinstaller isolato nel corretto ambiente virtuale gestito da uv
      - name: Build
        run: uv run pyinstaller StreamingCommunity.spec --clean --noconfirm

      # Verifica che la compressione UPX sia realmente avvenuta: se il binario
      # e' sospettosamente grande, upx non e' stato trovato.
      - name: Report binary size
        shell: bash
        run: |
          echo "UPX on PATH: $(command -v upx || echo 'not available')"
          ls -la dist/StreamingCommunity*

      - name: Rename binary (Linux)
        if: runner.os == 'Linux'
        run: mv dist/StreamingCommunity dist/StreamingCommunity_linux_x64

      - name: Rename binary (macOS)
        if: runner.os == 'macOS'
        run: mv dist/StreamingCommunity dist/StreamingCommunity_macos_x64

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: move dist\StreamingCommunity.exe dist\StreamingCommunity_win_x64.exe
        # Nota: Usato 'move' e i backslash (\) nativi di Windows per evitare crash su windows-latest

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamingCommunity-${{ runner.os }}
          path: dist/StreamingCommunity*

  attach-binaries:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*

  publish-pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # uv build sostituisce nativamente ed efficientemente "python -m build"
      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Allow re-releasing an existing version (e.g. when re-cutting the
          # same tag to refresh the binaries); skip files already on PyPI.
          skip-existing: true

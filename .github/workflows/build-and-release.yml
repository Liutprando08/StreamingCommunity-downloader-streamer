name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Configura uv e abilita il caching automatico per velocizzare i build futuri
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # uv installa Python automaticamente basandosi sul pyproject.toml o sul flag specificato
      - name: Set up Python
        run: uv python install 3.12

      # Installa pyinstaller e sincronizza le dipendenze dal file uv.lock
      - name: Install dependencies
        run: uv pip install pyinstaller && uv sync --no-install-project

      # Esegue pyinstaller isolato nel corretto ambiente virtuale gestito da uv
      - name: Build
        run: uv run pyinstaller StreamingCommunity.spec --clean --noconfirm

      - name: Rename binary (Linux)
        if: runner.os == 'Linux'
        run: mv dist/StreamingCommunity dist/StreamingCommunity_linux_x64

      - name: Rename binary (macOS)
        if: runner.os == 'macOS'
        run: mv dist/StreamingCommunity dist/StreamingCommunity_macos_x64

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: move dist\StreamingCommunity.exe dist\StreamingCommunity_win_x64.exe
        # Nota: Usato 'move' e i backslash (\) nativi di Windows per evitare crash su windows-latest

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamingCommunity-${{ runner.os }}
          path: dist/StreamingCommunity*

  attach-binaries:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*

  publish-pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # uv build sostituisce nativamente ed efficientemente "python -m build"
      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
